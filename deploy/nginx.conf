# /etc/nginx/conf.d/wb2.conf
# Two must-haves: /v1 needs buffering off (SSE), index.html needs no-store

server {
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    client_max_body_size 20m;

    # OpenAI-compatible API: pass SSE straight through
    location /v1/ {
        proxy_pass http://127.0.0.1:8078;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8078;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # If the Go binary serves the frontend (WB2_STATIC_DIR), this block is enough
    location / {
        proxy_pass http://127.0.0.1:8078;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # If nginx serves the frontend instead, replace location / above with:
    # root /opt/wb2api/dist;
    # location = /index.html { add_header Cache-Control "no-store"; }
    # location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    # location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}
