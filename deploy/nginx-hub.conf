# /etc/nginx/conf.d/wb-hub.conf
# 把账号池面板（hub 的 8788）藏到 nginx 后面：IP 白名单 + 可选 Basic Auth
#
# 前提：docker-compose.yml 里 hub 的端口改成只绑本机
#       - "127.0.0.1:8788:8788"
#
# Basic Auth（可选，想要就取消注释并建文件）：
#   apt install apache2-utils
#   htpasswd -c /etc/nginx/wb-hub.htpasswd admin

server {
    listen 443 ssl http2;
    server_name hub.example.com;

    ssl_certificate     /etc/letsencrypt/live/hub.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.example.com/privkey.pem;

    # hub 自己对请求体有 16MB 上限并返回带 hint 的 413，这边给到 32m
    client_max_body_size 32m;

    # 1) IP 白名单：把你自己的出口写进来，其余全拒
    allow 1.2.3.4;
    deny  all;

    # 2) 可选 Basic Auth（白名单 + 口令两层）
    # auth_basic           "wb hub";
    # auth_basic_user_file /etc/nginx/wb-hub.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 面板里有长轮询 / 流式，别攒包
        proxy_buffering off;
        proxy_read_timeout 3600s;

        # 授权流程里有 WebSocket / 长连接
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# 若套了 Cloudflare（橙云），allow 要放行 CF 网段，并在 http{} 里加：
#   set_real_ip_from 173.245.48.0/20;  ... ; real_ip_header CF-Connecting-IP;
# 否则 $remote_addr 永远是 CF 的 IP，白名单等于全放行。
