# /etc/nginx/conf.d/wb-hub.conf
# Put the account-pool panel (hub port 8788) behind nginx: IP allowlist + optional Basic Auth
#
# Prerequisite: in docker-compose.yml bind the hub to localhost only
#       - "127.0.0.1:8788:8788"
#
# Optional Basic Auth:
#   apt install apache2-utils
#   htpasswd -c /etc/nginx/wb-hub.htpasswd admin

server {
    listen 443 ssl http2;
    server_name hub.example.com;

    ssl_certificate     /etc/letsencrypt/live/hub.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.example.com/privkey.pem;

    # The hub caps request bodies at 16MB and returns a 413 with a hint; give nginx 32m
    client_max_body_size 32m;

    # 1) IP allowlist: your own egress IPs only
    allow 1.2.3.4;
    deny  all;

    # 2) Optional Basic Auth (allowlist + password, two layers)
    # auth_basic           "wb hub";
    # auth_basic_user_file /etc/nginx/wb-hub.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Long polling / streaming inside the panel: don't buffer
        proxy_buffering off;
        proxy_read_timeout 3600s;

        # The authorization flow uses long-lived / upgraded connections
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Behind Cloudflare (orange cloud) the allowlist must include CF ranges, plus in http{}:
#   set_real_ip_from 173.245.48.0/20;  ... ; real_ip_header CF-Connecting-IP;
# Otherwise $remote_addr is always a CF IP and "deny all" never matches.
