services:
  # ---------------- Upstream: the account pool itself ----------------
  # Adding accounts, rotation and realm splitting all happen here; this repo is just the facade.
  # Panel: http://SERVER_IP:8788/   Password: WB2_HUB_PANEL_PASS in .env
  hub:
    image: ghcr.io/ardeyouxipianyi/workbuddy2api-hub:latest
    container_name: wb-hub
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # This app calls the hub with this key; both sides must use the same value
      API_KEY: ${WB2_UPSTREAM_KEY:-}
    # The panel password can only be a CLI flag (no env var); default is admin, always change it.
    # This reproduces the image's own command and adds --panel-password.
    command:
      - python
      - wb_proxy.py
      - --host
      - 0.0.0.0
      - --lan
      - --panel-password
      - ${WB2_HUB_PANEL_PASS:-admin}
    volumes:
      - ./hub/accounts:/app/accounts    # credentials + settings.json (holds the panel password hash)
      - ./hub/usage:/app/usage          # usage log, read by this app for reconciliation
    ports:
      # Panel used to add accounts. For local-only access use 127.0.0.1:8788:8788 and an SSH tunnel.
      - "8788:8788"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8788/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------- This app: facade + frontend ----------------
  wb2:
    build: .
    image: wb2api:local
    container_name: wb2api
    restart: unless-stopped
    env_file: .env
    depends_on:
      hub:
        condition: service_started
    environment:
      # Daily quotas reset at local midnight; containers default to UTC
      TZ: ${TZ:-Asia/Shanghai}
      # Inside compose, resolve the hub by service name; bare metal uses 127.0.0.1
      WB2_UPSTREAM: ${WB2_UPSTREAM:-http://hub:8788}
      WB2_HUB_DIR: /hub
    ports:
      # Put nginx in front and change this to "127.0.0.1:8078:8078" — don't leave the admin panel public
      - "8078:8078"
    volumes:
      - ./data:/data                 # SQLite, keys, uploads
      - ./hub:/hub                   # shared with the hub: account dir + usage.jsonl
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8078/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
