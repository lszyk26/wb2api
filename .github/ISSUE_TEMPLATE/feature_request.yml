name: 功能建议 / Feature request
description: 想要的新能力、想改的交互（Suggest an idea）
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的实际问题
      description: 先说场景和痛点，再说方案 —— 这样更容易判断哪种解法合适
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案（可选）
