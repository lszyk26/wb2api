name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一个分支连续 push 时取消上一次，省 runner 时间
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: server · go vet + go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: go vet
        working-directory: server
        run: go vet ./...

      - name: go test
        working-directory: server
        run: go test -count=1 ./...

  web:
    name: web · npm ci + vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: 构建产物存在性检查
        run: test -d dist && test -f dist/index.html
